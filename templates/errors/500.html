{% extends "base.html" %}

{% block content %}
<div class="container section" style="min-height:65vh; display:flex; align-items:center; justify-content:center; padding:3rem 1rem;">
    <div style="max-width:520px; margin:0 auto; text-align:center;">

        <div style="width:96px; height:96px; background:#fef2f2; border-radius:50%; display:flex; align-items:center; justify-content:center; margin:0 auto 1.75rem;">
            <i class="fas fa-exclamation-triangle" style="font-size:2.4rem; color:#ef4444;"></i>
        </div>

        <p style="font-size:0.8rem; font-weight:800; letter-spacing:0.12em; text-transform:uppercase; color:#ef4444; margin-bottom:0.5rem;">Gabim 500</p>
        <h1 style="font-size:1.85rem; font-weight:800; color:var(--text-main); margin-bottom:0.75rem; line-height:1.2;">Ndodhi një gabim</h1>
        <p style="color:var(--text-muted); font-size:1rem; margin-bottom:2.25rem; line-height:1.6;">
            Diçka shkoi gabim nga ana jonë.<br>Ekipi teknik u njoftua. Provoni përsëri pas pak sekondash.
        </p>

        <div style="display:flex; gap:0.75rem; justify-content:center; flex-wrap:wrap;">
            <a href="{{ url_for('main.index') }}" class="btn btn-primary" style="padding:0.75rem 1.75rem;">
                <i class="fas fa-home" style="margin-right:0.4rem;"></i>Ballina
            </a>
            <a href="{{ url_for('main.products') }}" class="btn btn-outline" style="padding:0.75rem 1.75rem;">
                <i class="fas fa-box" style="margin-right:0.4rem;"></i>Produktet
            </a>
        </div>

    </div>
</div>
{% endblock %}
